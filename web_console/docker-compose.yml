name: runline-console
services:
  console:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: volume
        source: console_modules
        target: /workspace/node_modules
volumes:
  console_modules:
